[package]
name = "ssx-upload"
description = "Uploaders for ssx: ShareX .sxcu custom uploaders, Imgur, S3-compatible, HTTP, URL shorteners, OAuth2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["sxcu", "s3", "oauth"]
# ShareX `.sxcu` custom uploader engine (pulls in a lookaround-capable regex engine and XPath).
sxcu = ["dep:fancy-regex", "dep:sxd-document", "dep:sxd-xpath"]
# S3-compatible uploader and the in-crate AWS Signature V4 implementation.
s3 = ["dep:hmac", "dep:sha2"]
# OAuth2 loopback (PKCE) helper.
oauth = ["dep:sha2"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = { version = "0.16", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = { version = "0.12", optional = true }
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }
sxd-document = { version = "0.3", optional = true }
sxd-xpath = { version = "0.4", optional = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
http-body = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
