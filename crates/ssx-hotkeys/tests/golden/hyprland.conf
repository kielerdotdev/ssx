# Generated by ssx. Do not edit: this file is rewritten by `ssx hotkeys install`.
# Load it from hyprland.conf with the `source` line printed by that command.

# Ctrl+Shift+S: Capture region
bind = CTRL SHIFT, s, exec, ssx capture region

# Print: ssx capture screen
bind = , Print, exec, ssx capture screen

# Alt+Super+R: /usr/local/bin/ssx record --title 'My clip'
bind = ALT SUPER, r, exec, /usr/local/bin/ssx record --title 'My clip'

# Ctrl+Alt+Shift+Super+F12: Hostile: quotes, $, ; and ##
bind = CTRL ALT SHIFT SUPER, F12, exec, sh -c 'notify-send '\''ssx'\'' "done: '"$"'HOME"; echo 100% ## ok, really' 'arg with spaces'

# Super+Backquote: ssx capture window '--delay=2'
bind = SUPER, grave, exec, ssx capture window '--delay=2'

# VolumeMute: ssx 'ünïcödé 日本語'
bind = , XF86AudioMute, exec, ssx 'ünïcödé 日本語'
