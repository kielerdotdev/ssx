# Ctrl+Shift+S: Capture region
bindsym Ctrl+Shift+s exec ssx capture region

# Print: ssx capture screen
bindsym Print exec ssx capture screen

# Alt+Super+R: /usr/local/bin/ssx record --title 'My clip'
bindsym Alt+Mod4+r exec /usr/local/bin/ssx record --title "My clip"

# Ctrl+Alt+Shift+Super+F12: Hostile: quotes, $, ; and #
bindsym Ctrl+Alt+Shift+Mod4+F12 exec sh -c "notify-send 'ssx' \\\"done: \$HOME\\\"; echo 100% # ok, really" "arg with spaces"

# Super+Backquote: ssx capture window '--delay=2'
bindsym Mod4+grave exec ssx capture window "--delay=2"

# VolumeMute: ssx 'ünïcödé 日本語'
bindsym XF86AudioMute exec ssx "ünïcödé 日本語"
