[package]
name = "ssx-overlay"
description = "ShareX-style frozen-screen region selection overlay (X11, Wayland layer-shell / fullscreen, Windows) with a CPU renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ssx_overlay"

[[bin]]
name = "ssx-overlay"
path = "src/bin/ssx-overlay.rs"

[dependencies]
ssx-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
font8x8 = { version = "0.3", default-features = false, features = ["std"] }
memmap2 = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "event", "pipe"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xfixes", "randr"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
image.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[lints]
workspace = true
