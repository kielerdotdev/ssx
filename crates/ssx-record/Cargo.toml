[package]
name = "ssx-record"
description = "Screen recording: frame sources, audio, encoders (FFmpeg, gifski) and the recording session for ssx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["system", "gif", "gpl", "audio", "gpu", "portal"]

# --- FFmpeg linkage ---------------------------------------------------------------------
# `system`: link the distribution's libav* dynamically (development default; tested).
system = ["ffmpeg"]
# `static`: let ffmpeg-sys-next compile FFmpeg from source (git clone of the pinned release
# branch at build time) and link it statically. UNVERIFIED in the development sandbox
# (no network access to the FFmpeg source): see build/README.md. Use with
# `--no-default-features`.
static = [
    "ffmpeg",
    "ffmpeg-next/build",
    "ffmpeg-next/build-license-gpl",
    "ffmpeg-next/build-lib-x264",
    "ffmpeg-next/build-lib-x265",
    "ffmpeg-next/build-lib-vpx",
    "ffmpeg-next/build-lib-opus",
    "ffmpeg-next/build-pic",
]
# `static-prebuilt`: link an FFmpeg you built yourself (build/build-ffmpeg.sh, or vcpkg on
# Windows) statically, found through FFMPEG_DIR / PKG_CONFIG_PATH / vcpkg. UNVERIFIED.
static-prebuilt = ["ffmpeg", "ffmpeg-next/static"]
# Hardware-encoder switches for `static` (ffmpeg-sys-next's own configure wiring).
static-hw-windows = [
    "static",
    "dep:ffmpeg-sys-next",
    "ffmpeg-sys-next/build-amf",
    "ffmpeg-sys-next/build-nvenc",
    "ffmpeg-sys-next/build-lib-d3d11va",
    "ffmpeg-sys-next/build-lib-dxva2",
]
static-hw-linux = [
    "static",
    "dep:ffmpeg-sys-next",
    "ffmpeg-sys-next/build-vaapi",
    "ffmpeg-sys-next/build-nvenc",
]
static-hw-macos = [
    "static",
    "dep:ffmpeg-sys-next",
    "ffmpeg-sys-next/build-videotoolbox",
    "ffmpeg-sys-next/build-audiotoolbox",
]
# Internal: FFmpeg-backed encoders and the decode-back verification helpers.
ffmpeg = ["dep:ffmpeg-next"]
# GIF output through gifski (AGPL-3.0-or-later; compatible with this GPL-3 project).
gif = ["dep:gifski", "dep:imgref", "dep:rgb"]
# Allow GPL-licensed encoders (libx264, libx265) by default. Turning it off makes the
# default selection LGPL-only (hardware, libopenh264, native, libvpx, SVT-AV1).
gpl = []
# System and microphone audio through cpal (WASAPI loopback, PipeWire/PulseAudio).
audio = ["dep:cpal", "dep:rubato"]
# GPU tone mapping + NV12 conversion through ssx-gpu (wgpu).
gpu = ["dep:ssx-gpu"]
# Linux Wayland GNOME/KDE: xdg-desktop-portal ScreenCast + PipeWire.
portal = ["dep:ashpd", "dep:pipewire", "dep:async-io", "dep:directories"]

[dependencies]
ssx-types.workspace = true
ssx-capture.workspace = true
ssx-hdr.workspace = true
ssx-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
half.workspace = true

ffmpeg-next = { version = "9", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }
ffmpeg-sys-next = { version = "9", optional = true, default-features = false }
gifski = { version = "1.34", optional = true, default-features = false }
imgref = { version = "1", optional = true }
rgb = { version = "0.8", optional = true }
rubato = { version = "5", optional = true }
ssx-gpu = { workspace = true, optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
ssx-capture-x11.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ssx-capture-wayland.workspace = true
# PipeWire host: system-audio loopback (an input stream on a sink); PulseAudio host:
# monitor sources on systems without PipeWire.
cpal = { version = "0.18", optional = true, features = ["pipewire", "pulseaudio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "event", "mm", "time"] }
# The portal client. `async-io` keeps tokio out of the tree (same choice as ssx-capture-portal).
ashpd = { version = "0.13", optional = true, default-features = false, features = ["async-io", "screencast"] }
pipewire = { version = "0.10", optional = true }
async-io = { version = "2", optional = true }
directories = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dev-dependencies]
x11rb = "0.14"

# The wayland tests reuse ssx-capture-wayland's test harness (headless sway launcher and a
# mock compositor) by path, which needs the server side of the protocol crates.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
serde_json.workspace = true
# The mock ScreenCast portal of tests/portal.rs.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[lints]
workspace = true
