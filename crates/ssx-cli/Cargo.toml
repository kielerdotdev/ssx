[package]
name = "ssx-cli"
description = "The `ssx` command-line tool: capture, upload, history, configuration, hotkeys, shell integration and diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ssx_cli"
path = "src/lib.rs"

[[bin]]
name = "ssx"
path = "src/main.rs"

[dependencies]
ssx-types.workspace = true
ssx-core.workspace = true
ssx-platform.workspace = true
ssx-shell.workspace = true
ssx-upload.workspace = true
ssx-hotkeys.workspace = true
ssx-ipc.workspace = true
ssx-services = { path = "../ssx-services" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
toml = "0.9"
toml_edit = "0.23"
ctrlc = { version = "3", features = ["termination"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
x11rb = "0.14"

[lints]
workspace = true
